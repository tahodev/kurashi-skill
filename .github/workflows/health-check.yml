name: health-check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every night at 21:17 JST.
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Lint skills and Markdown
        run: bash scripts/lint-skills.sh
      - name: Check README and docs drift
        run: python3 scripts/check-docs-drift.py
      - name: Check static-data freshness and fixtures
        run: python3 scripts/check-static-data.py
      - name: Validate documented code blocks
        run: python3 scripts/check-code-blocks.py
      - name: Run fixed-fixture regression and core skill smoke tests
        run: python3 tests/test-core-skills.py
      - name: Check documented URLs and API responses
        run: python3 scripts/check-urls.py
      - name: Open or update a GitHub issue on scheduled/manual failure
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="health-check failed: lint, docs, code, or URL ($(date -u +%Y-%m-%d))"
          BODY="Health-check failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          EXISTING=$(gh issue list --state open --search 'health-check failed' --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label 'health-check' || gh issue create --title "$TITLE" --body "$BODY"
          fi
      - name: Close the health-check issue when scheduled/manual checks recover
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --state open --label 'health-check' --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            EXISTING=$(gh issue list --state open --search 'health-check failed' --json number --jq '.[0].number // empty')
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Health-check recovered ($(date -u +%Y-%m-%d)). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue close "$EXISTING"
          fi
